<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Instituto Esperança</title>
	
	<link rel="stylesheet" href="style.css">
</head>

<body>
<a href="#conteudo-principal" class="skip-link">Pular para o conteúdo</a>
    <header>
        <h1>Cadastro de colaboradores</h1>

        <nav>
            <a href="index.html">Início</a>
            <a href="projetos.html">Projetos</a>
            <a href="cadastro.html">Participe</a>
        </nav>

        <button type="button" id="alternar-tema" class="toggle-tema" aria-pressed="false">
            🌙 Modo escuro
        </button>
    </header>

    <main id="conteudo-principal">

<div class="alerta alerta-info">
		<p>
        Preencha seus dados corretamente para participar das ações
        do Instituto Esperança.
		</p>
    </div>

        <form action="#" method="post">

            <fieldset>
                <legend>Dados pessoais</legend>

                <label for="nome">Nome completo:</label>
                <input type="text" id="nome" name="nome" required>

                <br><br>

                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required>

                <br><br>

                <label for="nascimento">Data de nascimento:</label>
                <input type="date" id="nascimento" name="nascimento" required>

                <br><br>

                <label for="cpf">CPF:</label>
                <input type="text" id="cpf" name="cpf"
                       pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}"
                       placeholder="000.000.000-00"
                       required>

                <br><br>

                <label for="telefone">Telefone:</label>
                <input type="tel" id="telefone" name="telefone"
                       pattern="\([0-9]{2}\) [0-9]{5}-[0-9]{4}"
                       placeholder="(00) 00000-0000"
                       required>
            </fieldset>

            <br>

            <fieldset>
                <legend>Endereço</legend>

                <label for="cep">CEP:</label>
                <input type="text" id="cep" name="cep"
                       pattern="[0-9]{5}-[0-9]{3}"
                       placeholder="00000-000"
                       required>

                <br><br>

                <label for="endereco">Endereço:</label>
                <input type="text" id="endereco" name="endereco" required>

                <br><br>

                <label for="cidade">Cidade:</label>
                <input type="text" id="cidade" name="cidade" required>

                <br><br>

                <label for="estado">Estado:</label>
                <input type="text" id="estado" name="estado" maxlength="2"
                       placeholder="SP" required>
            </fieldset>

            <br>

            <fieldset>
                <legend>Participação</legend>

                <label for="interesse">Como deseja contribuir?</label>

                <select id="interesse" name="interesse" required>
                    <option value="">Selecione</option>
                    <option value="doacao">Doação</option>
                    <option value="voluntariado">Voluntariado</option>
                    <option value="ambos">Doação e voluntariado</option>
                </select>
            </fieldset>

            <br>

            <button type="submit">Enviar cadastro</button>

        </form>

    </main>

    <footer>
        <p>&copy; 2026 Instituto Esperança. Todos os direitos reservados.</p>
    </footer>
<script src="https://cdn.jsdelivr.net/npm/imask@7.6.1/dist/imask.min.js"></script>
<script src="mascaras.js"></script>
<script src="armazenamento.js"></script>
<script src="validacao.js"></script>
<script src="tema.js"></script>
</body>
</html>
